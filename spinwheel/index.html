<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>วงล้อสุ่มชื่อ — TARARIN 999</title>
<link rel="icon" type="image/png" href="../TRR999logo.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>if(localStorage.getItem('trr_dark_mode')==='1')document.documentElement.classList.add('dark');var _a=localStorage.getItem('trr_accent');if(_a&&_a!=='ocean')document.documentElement.setAttribute('data-accent',_a);</script>
<script>if(window.self!==window.top)document.documentElement.classList.add('in-iframe');</script>
<link rel="stylesheet" href="../glass.css?v=1">
<link rel="stylesheet" href="../ui-fx.css?v=1">
<script src="../ui-fx.js?v=1"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Prompt','Leelawadee UI',Tahoma,sans-serif;font-size:14px;color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%;animation:pgFade .22s ease;background:linear-gradient(140deg,var(--bg-from) 0%,var(--bg-mid) 50%,var(--bg-to) 100%);background-attachment:fixed;}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px;}
.head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.head .ico{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;}
.head h1{font-size:21px;font-weight:800;color:var(--text);}
.head .sub{color:var(--muted);font-size:12.5px;margin-left:auto;}
.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start;}
@media(max-width:820px){.layout{grid-template-columns:1fr;}}

/* Wheel */
.wheel-box{display:flex;flex-direction:column;align-items:center;gap:16px;}
.wheel-stage{position:relative;width:100%;max-width:460px;aspect-ratio:1;}
#wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 30px rgba(15,23,42,.22));border-radius:50%;transition:none;}
.wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--glass-bg-card);border:3px solid var(--glass-border);box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;transition:transform .15s;}
.wheel-hub:hover{transform:translate(-50%,-50%) scale(1.06);}
.wheel-hub:active{transform:translate(-50%,-50%) scale(.94);}
.wheel-hub svg{width:24px;height:24px;color:var(--primary);}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:4;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));}
.wheel-pointer svg{width:38px;height:38px;color:var(--red,#dc2626);}
.spin-btn{font-family:inherit;font-size:16px;font-weight:800;padding:13px 40px;border-radius:14px;border:none;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));cursor:pointer;box-shadow:0 8px 22px rgba(31,60,180,.28);transition:transform .15s,box-shadow .15s;letter-spacing:.5px;}
.spin-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px rgba(31,60,180,.36);}
.spin-btn:active:not(:disabled){transform:translateY(0);}
.spin-btn:disabled{opacity:.5;cursor:default;}

/* Panel */
.panel{background:var(--glass-bg-card);border:1px solid var(--glass-border-sm);border-radius:16px;padding:16px 16px 18px;backdrop-filter:var(--blur);}
.panel h2{font-size:13px;font-weight:700;color:var(--text2,var(--muted));text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.panel h2 .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--primary);background:var(--badge-bg);padding:2px 10px;border-radius:20px;}
#names{width:100%;min-height:220px;resize:vertical;padding:12px 13px;border-radius:11px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-family:inherit;font-size:15px;line-height:1.7;outline:none;}
#names:focus{border-color:var(--input-focus);}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--glass-border-sm);background:var(--glass-bg-subtle);color:var(--text);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--sb-item-hover);transform:translateY(-1px);}
.btn.accent{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none;}
.opt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--text2,var(--muted));cursor:pointer;user-select:none;}
.opt input{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;}

/* Winner modal */
#win-modal{display:none;position:fixed;inset:0;z-index:400;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;animation:pgFade .18s ease;}
#win-modal.show{display:flex;}
.win-box{background:var(--glass-bg-card);border:1px solid var(--glass-border);border-radius:22px;padding:32px 34px;text-align:center;max-width:420px;width:100%;box-shadow:0 24px 64px rgba(15,23,42,.3);backdrop-filter:blur(24px);animation:winPop .4s cubic-bezier(.22,1.3,.5,1);}
@keyframes winPop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.win-box .tada{font-size:44px;margin-bottom:6px;}
.win-box .lbl{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.5px;}
.win-box .name{font-size:30px;font-weight:800;color:var(--primary);margin:8px 0 22px;word-break:break-word;line-height:1.2;}
.win-btns{display:flex;gap:10px;}
.win-btns .btn{flex:1;justify-content:center;padding:12px;font-size:14px;}
.empty-hint{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;}
.hint{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.5;}
.hint b{color:var(--primary);}
.mode-wrap{margin-top:12px;}
.mode-lbl{display:block;font-size:12px;font-weight:600;color:var(--text2,var(--muted));margin-bottom:5px;}
#opt-mode{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-family:inherit;font-size:13.5px;outline:none;cursor:pointer;}
#opt-mode:focus{border-color:var(--input-focus);}
.wheel-stage.shake{animation:wheelShake .5s cubic-bezier(.36,.07,.19,.97);}
@keyframes wheelShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
#wheel.win-pulse{animation:winPulse .6s ease 2;}
@keyframes winPulse{50%{filter:drop-shadow(0 0 22px var(--accent)) drop-shadow(0 12px 30px rgba(15,23,42,.22));}}

/* Expand button + fullscreen mode */
.expand-btn{font-family:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;border:1px solid var(--glass-border-sm);background:var(--glass-bg-subtle);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
.expand-btn:hover{background:var(--sb-item-hover);transform:translateY(-1px);}
.fs-close{display:none;position:fixed;top:14px;right:14px;z-index:600;width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-bg-card);color:var(--text);font-size:20px;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);backdrop-filter:blur(10px);}
body.wheel-full{overflow:hidden;}
body.wheel-full .wrap{max-width:none;padding:0;}
body.wheel-full .head,body.wheel-full .panel{display:none;}
body.wheel-full .layout{grid-template-columns:1fr;min-height:100dvh;place-items:center;gap:0;}
body.wheel-full .wheel-box{gap:clamp(16px,4vh,30px);width:100%;}
body.wheel-full .wheel-stage{max-width:min(82vh,94vw);width:min(82vh,94vw);}
body.wheel-full .spin-btn{font-size:19px;padding:16px 52px;}
body.wheel-full .fs-close{display:flex;}

/* Responsive: iPad + phone */
@media(max-width:768px){.wrap{padding:16px 12px 50px;}.head h1{font-size:19px;}.head .sub{width:100%;margin-left:0;order:3;}}
@media(max-width:560px){.wrap{padding:12px 10px 40px;}.wheel-stage{max-width:min(88vw,420px);}.spin-btn{font-size:15px;padding:12px 34px;}.head .ico{width:34px;height:34px;font-size:18px;}.head h1{font-size:18px;}#names{min-height:150px;font-size:16px;}.row{gap:6px;}.btn{padding:8px 11px;font-size:12.5px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="ico">🎡</span>
    <h1>วงล้อสุ่มชื่อ</h1>
    <span class="sub">หมุนสุ่มชื่อสำหรับกิจกรรมในออฟฟิศ</span>
    <button class="expand-btn" id="btnExpand">⛶ เต็มจอ</button>
  </div>
  <button class="fs-close" id="btnClose" title="ออกจากเต็มจอ (Esc)">✕</button>

  <div class="layout">
    <!-- Wheel -->
    <div class="wheel-box">
      <div class="wheel-stage">
        <div class="wheel-pointer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22 4 8h16z"/></svg></div>
        <canvas id="wheel" width="600" height="600"></canvas>
        <div class="wheel-hub" id="hub" title="กดเพื่อหมุน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
      </div>
      <button class="spin-btn" id="spinBtn">🎯 หมุนเลย!</button>
    </div>

    <!-- Names panel -->
    <div class="panel">
      <h2>รายชื่อ <span class="cnt" id="name-count">0</span></h2>
      <textarea id="names" placeholder="ใส่ชื่อ 1 ชื่อต่อบรรทัด&#10;ใส่ x ตามด้วยเลข = ขนาดช่อง (โอกาสมากขึ้น)&#10;เช่น&#10;โอม x3&#10;เบล&#10;ช้างฟาง x2"></textarea>
      <div class="hint">💡 พิมพ์ <b>ชื่อ x3</b> = ช่องใหญ่ 3 เท่า (โอกาสออกมากขึ้น) · <b>ชื่อ x1</b> หรือไม่ใส่ = ปกติ</div>
      <div class="row">
        <button class="btn" id="btn-shuffle">🔀 สลับ</button>
        <button class="btn" id="btn-drivers">🚛 โหลดชื่อคนขับ</button>
        <button class="btn" id="btn-clear">🗑️ ล้าง</button>
      </div>
      <label class="opt"><input type="checkbox" id="opt-remove"> เอาชื่อที่ถูกสุ่มออกจากวง (ไม่ซ้ำ)</label>
      <label class="opt"><input type="checkbox" id="opt-sound" checked> 🔊 เปิดเสียง</label>
      <div class="mode-wrap">
        <label class="mode-lbl">🎭 ลูกเล่นการหมุน</label>
        <select id="opt-mode">
          <option value="random">🎲 สุ่มลูกเล่น (แนะนำ)</option>
          <option value="normal">ปกติ</option>
          <option value="fakeout">😜 หลอกก่อนเฉลย (สุ่ม 1-3 ครั้ง)</option>
          <option value="reverse">↩️ หมุนเลยแล้วเด้งกลับ (สุ่มจังหวะ)</option>
          <option value="stutter">🎢 หลอกหลายจังหวะ (สุ่ม 2-4)</option>
          <option value="teasing">🫣 ยั่วช้าๆ ขยับทีละนิด</option>
          <option value="chaos">🌀 ป่วนสุด เดาไม่ได้ (3-6 จังหวะมั่ว)</option>
          <option value="devour">🐍 กินวง (ชื่อคนพองกินเกือบทั้งวง)</option>
          <option value="devourflip">🎭 กินวงแล้วพลิก (พองคนนึง เฉลยอีกคน)</option>
          <option value="combo">🎰 ผสมมั่ว (หลายลูกเล่นในหมุนเดียว)</option>
          <option value="slowreveal">🐢 ค่อยๆ เฉลยช้าๆ ลุ้น</option>
          <option value="turbo">⚡ เทอร์โบ (หมุนแรงยาว)</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- Winner modal -->
<div id="win-modal" onclick="if(event.target===this)closeWin()">
  <div class="win-box">
    <div class="tada">🎉</div>
    <div class="lbl">ผู้โชคดี</div>
    <div class="name" id="win-name">—</div>
    <div class="win-btns">
      <button class="btn" id="win-remove">เอาออกจากวง</button>
      <button class="btn accent" id="win-again">หมุนอีกครั้ง</button>
    </div>
  </div>
</div>

<script>
var canvas=document.getElementById('wheel'), ctx=canvas.getContext('2d');
var names=[], baseWeights=[], rot=0, spinning=false, lastWinner=-1, weights=[];
var COLORS=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1','#14b8a6','#eab308'];
// Base slice sizes per name (user-set, e.g. "A x3" = 3 slices). "reset" restores these.
function baseW(){if(baseWeights.length!==names.length)return names.map(function(){return 1;});return baseWeights.slice();}
// weighted winner pick — bigger slice = higher chance
function pickWinner(){var total=0,i;for(i=0;i<baseWeights.length;i++)total+=baseWeights[i];var r=Math.random()*total,acc=0;for(i=0;i<baseWeights.length;i++){acc+=baseWeights[i];if(r<acc)return i;}return names.length-1;}
function segBounds(){
  var n=names.length; if(!n)return [];
  if(!weights||weights.length!==n)weights=baseW();
  var total=0,i;for(i=0;i<n;i++)total+=(weights[i]||0.0001);
  var acc=0,out=[];
  for(i=0;i<n;i++){var a0=2*Math.PI*acc/total;acc+=(weights[i]||0.0001);out.push([a0,2*Math.PI*acc/total]);}
  return out;
}
var DPR=Math.min(window.devicePixelRatio||1,2);

function loadNames(){
  var s='';try{s=localStorage.getItem('spinwheel_names')||'';}catch(e){}
  if(!s)s='โอม\nเบล\nช้างฟาง\nเป้าเป้';
  document.getElementById('names').value=s;
  parseNames();
}
function parseNames(){
  var lines=document.getElementById('names').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  names=[];baseWeights=[];
  var totalSlices=0;
  lines.forEach(function(line){
    // "ชื่อ x3" / "ชื่อ *3" / "ชื่อ ×3" → weight 3 (else 1)
    var m=line.match(/^(.*?)\s*[x*×]\s*(\d{1,2})\s*$/i);
    var nm=m?m[1].trim():line, w=m?Math.max(1,Math.min(30,parseInt(m[2],10))):1;
    if(!nm)return;
    names.push(nm);baseWeights.push(w);totalSlices+=w;
  });
  document.getElementById('name-count').textContent=names.length+(totalSlices!==names.length?(' · '+totalSlices+' ช่อง'):'');
  try{localStorage.setItem('spinwheel_names',document.getElementById('names').value);}catch(e){}
  if(!spinning)weights=baseW();   // reset to configured slice sizes when editing
  draw();
}
function sizeCanvas(){
  var box=canvas.getBoundingClientRect();
  var s=Math.max(200,box.width);
  canvas.width=s*DPR;canvas.height=s*DPR;
  draw();
}
function draw(){
  var W=canvas.width, R=W/2, cx=R, cy=R;
  ctx.clearRect(0,0,W,W);
  var n=names.length;
  if(n===0){
    ctx.fillStyle=getVar('--glass-bg-subtle')||'rgba(0,0,0,.05)';
    ctx.beginPath();ctx.arc(cx,cy,R-2,0,2*Math.PI);ctx.fill();
    ctx.fillStyle=getVar('--muted')||'#888';ctx.font=(R*0.09)+'px Prompt, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('ใส่ชื่อก่อน',cx,cy);
    return;
  }
  var b=segBounds(); // [ [a0,a1], ... ] absolute (0..2π), before rot
  for(var i=0;i<n;i++){
    var a0=b[i][0]+rot, a1=b[i][1]+rot, mid=(b[i][0]+b[i][1])/2+rot, sw=b[i][1]-b[i][0];
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R-4,a0,a1);ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=Math.max(1,R*0.006);ctx.stroke();
    if(sw<0.02)continue; // too thin to label
    // text
    ctx.save();
    ctx.translate(cx,cy);ctx.rotate(mid);
    ctx.fillStyle='#fff';ctx.textAlign='right';ctx.textBaseline='middle';
    var fs=Math.min(R*0.14, Math.max(R*0.05, Math.min((R*0.9)/Math.max(6,names[i].length), sw*R*0.5)) );
    ctx.font='700 '+fs+'px Prompt, sans-serif';
    var label=names[i].length>18?names[i].slice(0,17)+'…':names[i];
    ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=3;
    ctx.fillText(label, R-R*0.09, 0);
    ctx.restore();
  }
  // outer ring
  ctx.beginPath();ctx.arc(cx,cy,R-3,0,2*Math.PI);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=R*0.02;ctx.stroke();
}
function getVar(v){try{return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}catch(e){return '';}}

// ── Sound (WebAudio, no files) ──
var _ac=null;
function audioCtx(){if(!_ac){try{_ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(_ac&&_ac.state==='suspended')_ac.resume();return _ac;}
function sndOn(){var el=document.getElementById('opt-sound');return el&&el.checked;}
function beep(freq,dur,type,vol){var ac=_ac;if(!ac||!sndOn())return;try{var o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=freq;var t=ac.currentTime;g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.05));o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+(dur||0.05));}catch(e){}}
function tickSound(speed){beep(760+Math.min(700,speed*9),0.028,'square',0.045);}
function winSound(){var ac=audioCtx();if(!ac||!sndOn())return;[0,4,7,12,16].forEach(function(st,i){setTimeout(function(){beep(392*Math.pow(2,st/12),0.22,'triangle',0.09);},i*95);});}

// ── Rotation helpers ──
var _lastTopSeg=-1;
function topSegIndex(){
  var n=names.length;if(!n)return -1;
  var b=segBounds(), top=1.5*Math.PI;
  var a=((top-rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  for(var i=0;i<n;i++){if(a>=b[i][0]&&a<b[i][1])return i;}
  return n-1;
}
function rotForWinner(idx,spins){
  var b=segBounds();
  var mid=(b[idx][0]+b[idx][1])/2;
  var delta=(1.5*Math.PI-(mid+rot))%(2*Math.PI);if(delta<0)delta+=2*Math.PI;
  return rot+spins*2*Math.PI+delta;
}
var easeOut=function(p){return 1-Math.pow(1-p,3);};
var easeInOut=function(p){return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;};
function animateTo(target,dur,ease,cb){
  var start=rot,t0=null;
  function step(ts){
    if(!t0)t0=ts;
    var p=Math.min((ts-t0)/dur,1), prev=rot;
    rot=start+(target-start)*ease(p);
    draw();
    var s=topSegIndex();
    if(s!==_lastTopSeg){_lastTopSeg=s;tickSound(Math.abs(rot-prev)*60);}
    if(p<1)requestAnimationFrame(step);
    else{rot=target;draw();if(cb)cb();}
  }
  requestAnimationFrame(step);
}
// Animate segment weights (grow/shrink) while also turning the wheel a bit.
function animateWeights(fromW,toW,dur,addRot,cb){
  var t0=null,startRot=rot;
  function step(ts){
    if(!t0)t0=ts;
    var p=Math.min((ts-t0)/dur,1), e=1-Math.pow(1-p,2);
    var w=[];for(var i=0;i<fromW.length;i++)w.push(fromW[i]+(toW[i]-fromW[i])*e);
    weights=w; rot=startRot+addRot*e; draw();
    if(p<1)requestAnimationFrame(step);
    else{weights=toW.slice();rot=startRot+addRot;draw();if(cb)cb();}
  }
  requestAnimationFrame(step);
}

// ── Random helpers ──
function rInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function rF(a,b){return a+Math.random()*(b-a);}
function randDecoy(exclude){var n=names.length;if(n<=2)return (exclude+1)%n;var d;do{d=Math.floor(Math.random()*n);}while(d===exclude);return d;}
var easeIn4=function(p){return 1-Math.pow(1-p,4);};

// ── Sequence runner: each step is idx/spins(/over) OR an absolute rot. Steps run
//    back-to-back; the LAST step always resolves to the real winner. ──
function runSteps(steps,i,finish){
  i=i||0;
  if(i>=steps.length){finish();return;}
  var s=steps[i], next=function(){runSteps(steps,i+1,finish);};
  if(s.type==='pause'){setTimeout(next,s.ms||400);return;}
  if(s.type==='grow'){if(s.haptic&&window.TRRfx)TRRfx.haptic(s.haptic);animateWeights(weights.slice(),s.to,s.dur,s.addRot||0,next);return;}
  var go=function(){
    if(s.haptic&&window.TRRfx)TRRfx.haptic(s.haptic);
    var target;
    if(s.abs!=null)target=s.abs;                       // absolute rot (single-mode only)
    else if(s.type==='delta')target=rot+s.d;           // relative move (e.g. reverse-settle)
    else target=rotForWinner(s.idx,s.spins)+(s.over||0);
    animateTo(target,s.dur,s.ease||easeOut,next);
  };
  if(s.pause)setTimeout(go,s.pause);else go();
}
// weights that make one index eat the wheel
function bigWeights(idx){var n=names.length;return names.map(function(_,i){return i===idx?(n*7):0.5;});}

function spin(){
  if(spinning)return;
  parseNames();
  if(names.length<2){if(window.TRRfx)TRRfx.toast('ใส่ชื่ออย่างน้อย 2 ชื่อ',{type:'warn'});return;}
  audioCtx(); // unlock on user gesture
  spinning=true;
  weights=baseW();   // start every spin with equal slices
  document.getElementById('spinBtn').disabled=true;
  var n=names.length, seg=2*Math.PI/n;
  var winner=pickWinner();   // weighted by slice size
  var mode=document.getElementById('opt-mode').value;
  if(mode==='random'){var ms=['normal','fakeout','reverse','stutter','teasing','chaos','devour','devourflip','combo','combo','slowreveal','turbo'];mode=ms[Math.floor(Math.random()*ms.length)];}
  if(window.TRRfx)TRRfx.haptic(20);
  function finish(){rot=rot%(2*Math.PI);draw();spinning=false;document.getElementById('spinBtn').disabled=false;lastWinner=winner;showWin(names[winner]);}

  // ── กินวง: spin a bit, then the winner's slice swells to eat almost the whole
  //    wheel, then lands on them. (weight-animated, so handled separately.) ──
  if(mode==='devour'){
    var eq=baseW();
    var big=names.map(function(_,idx){return idx===winner?(n*7):0.5;});
    weights=eq.slice();
    animateTo(rotForWinner(winner,rInt(3,5)), rF(2000,2600), easeOut, function(){
      if(window.TRRfx)TRRfx.haptic([15,45,15]);
      animateWeights(eq, big, rF(1100,1500), 2*Math.PI*rF(0.5,0.9), function(){
        animateTo(rotForWinner(winner,0), rF(1250,1750), easeIn4, finish);
      });
    });
    return;
  }
  // ── กินวงแล้วพลิก: a DECOY eats the wheel (looks like sure win) → then lands on
  //    the real winner's tiny sliver = surprise twist. ──
  if(mode==='devourflip'){
    var vd=randDecoy(winner);
    runSteps([
      {idx:vd,spins:rInt(3,5),dur:rF(2000,2600),ease:easeOut},
      {type:'grow',to:bigWeights(vd),dur:rF(1000,1400),addRot:2*Math.PI*rF(0.4,0.7),haptic:[15,45,15]},
      {type:'pause',ms:rF(500,850)},
      {idx:winner,spins:0,dur:rF(1500,2000),ease:easeIn4,haptic:[10,70,10]}   // creep onto the sliver (slow)
    ],0,finish);
    return;
  }
  // ── ผสมหลายลูกเล่นในหมุนเดียว (random combo) ──
  if(mode==='combo'){
    var tasks=[], cp=winner, phases=rInt(2,3);
    for(var pi=0;pi<phases;pi++){
      var pr=Math.random();
      if(pr<0.28){ var d1=randDecoy(cp);cp=d1; tasks.push({idx:d1,spins:rInt(3,6),dur:rF(1700,2500),ease:easeOut,haptic:16}); }
      else if(pr<0.55){ var st=rInt(2,3);for(var q=0;q<st;q++){var d2=randDecoy(cp);cp=d2;tasks.push({idx:d2,spins:q===0?rInt(2,4):rInt(1,2),dur:rF(1200,2000),ease:q===0?easeOut:easeInOut,haptic:14});} }
      else if(pr<0.8){ var d3=randDecoy(cp);cp=d3; tasks.push({idx:d3,spins:rInt(2,3),dur:rF(1300,1900),ease:easeOut}); tasks.push({type:'grow',to:bigWeights(d3),dur:rF(900,1200),addRot:2*Math.PI*rF(0.3,0.6),haptic:[15,45,15]}); tasks.push({type:'pause',ms:rF(350,650)}); tasks.push({type:'grow',to:baseW(),dur:rF(700,1000),addRot:2*Math.PI*rF(0.3,0.6)}); }
      else { var d4=randDecoy(cp);cp=d4; var O=seg*rF(0.4,0.9); tasks.push({idx:d4,spins:rInt(3,5),over:O,dur:rF(1800,2500),ease:easeOut}); tasks.push({type:'delta',d:-O,dur:rF(600,900),ease:easeOut,haptic:12}); }
    }
    // finale (random): devour-win / flip-to-sliver / plain creep
    var fr=Math.random();
    if(fr<0.34){ tasks.push({idx:winner,spins:rInt(1,2),dur:rF(1300,1900),ease:easeOut}); tasks.push({type:'grow',to:bigWeights(winner),dur:rF(900,1200),addRot:2*Math.PI*rF(0.3,0.6),haptic:[15,45,15]}); tasks.push({idx:winner,spins:0,dur:rF(1200,1650),ease:easeIn4,haptic:[10,60,10]}); }
    else if(fr<0.6){ var fd=randDecoy(winner); tasks.push({idx:fd,spins:rInt(1,2),dur:rF(1300,1900),ease:easeOut}); tasks.push({type:'grow',to:bigWeights(fd),dur:rF(900,1200),addRot:2*Math.PI*rF(0.3,0.5),haptic:[15,45,15]}); tasks.push({type:'pause',ms:rF(400,700)}); tasks.push({idx:winner,spins:0,dur:rF(1350,1800),ease:easeIn4,haptic:[10,70,10]}); }
    else { tasks.push({idx:winner,spins:rInt(1,2),dur:rF(2400,3100),ease:easeIn4,haptic:[10,50,10]}); }
    runSteps(tasks,0,finish);
    return;
  }

  var steps=[], prev, i, wRot, pre, k;
  if(mode==='fakeout'){
    // 1–3 fake stops (unpredictable) then creep to real winner
    var fakes=rInt(1,3); prev=winner;
    var d0=randDecoy(winner); steps.push({idx:d0,spins:rInt(4,6),dur:rF(2800,3500)}); prev=d0;
    for(i=1;i<fakes;i++){var d=randDecoy(prev);steps.push({idx:d,spins:0,dur:rF(900,1500),pause:rF(450,800),ease:easeInOut,haptic:[10,50,10]});prev=d;}
    steps.push({idx:winner,spins:0,dur:rF(1600,2200),pause:rF(550,850),ease:easeIn4,haptic:[10,70,10]});
  }
  else if(mode==='reverse'){
    // overshoot then bounce back; sometimes a 2nd smaller bounce
    wRot=rotForWinner(winner,rInt(5,7));
    steps.push({abs:wRot+seg*rF(0.5,1.1),dur:rF(3000,3800),ease:easeOut});
    if(rInt(0,1)){steps.push({abs:wRot,dur:rF(750,1000),ease:easeOut});steps.push({abs:wRot+seg*rF(0.25,0.6),dur:rF(450,700),ease:easeOut,haptic:12});}
    steps.push({abs:wRot,dur:rF(1050,1450),ease:easeIn4});   // slow final settle
  }
  else if(mode==='stutter'){
    // 2–4 slowdown stops (random count/timing) then winner
    var stops=rInt(2,4); prev=winner;
    for(i=0;i<stops;i++){var dd=randDecoy(prev);steps.push({idx:dd,spins:i===0?rInt(3,5):rInt(1,2),dur:rF(1500,2600),ease:i===0?easeOut:easeInOut,haptic:18});prev=dd;}
    steps.push({idx:winner,spins:rInt(1,2),dur:rF(2200,3000),ease:easeOut});
  }
  else if(mode==='teasing'){
    // big spin to just-before winner, then 2–4 tiny creeps to the exact spot
    wRot=rotForWinner(winner,rInt(4,6)); pre=wRot-seg*rF(0.4,0.6);
    steps.push({abs:pre,dur:rF(2800,3500),ease:easeOut});
    k=rInt(2,4);
    for(i=1;i<=k;i++){steps.push({abs:pre+(wRot-pre)*(i/(k+1)),dur:rF(380,680),ease:easeInOut,pause:rF(150,340),haptic:8});}
    steps.push({abs:wRot,dur:rF(900,1350),ease:easeIn4,pause:rF(160,320),haptic:[8,40,8]});   // slow final creep
  }
  else if(mode==='chaos'){
    // fully unpredictable: 3–6 random stages, random dirs/pauses, then winner
    var stages=rInt(3,6); prev=winner;
    for(i=0;i<stages;i++){var dc=randDecoy(prev);prev=dc;
      steps.push({idx:dc,spins:rInt(0,3),dur:rF(650,2100),ease:Math.random()<0.5?easeOut:easeInOut,over:Math.random()<0.4?seg*rF(-0.6,0.6):0,pause:Math.random()<0.4?rF(180,560):0,haptic:Math.random()<0.5?12:0});}
    steps.push({idx:winner,spins:rInt(1,3),dur:rF(2000,3200),ease:easeOut,haptic:[10,60,10]});
  }
  else if(mode==='slowreveal'){ steps.push({idx:winner,spins:rInt(6,8),dur:rF(5800,7000),ease:easeIn4}); }
  else if(mode==='turbo'){ steps.push({idx:winner,spins:rInt(10,13),dur:rF(4800,5600),ease:easeOut}); }
  else { steps.push({idx:winner,spins:rInt(5,7),dur:rF(4000,4800),ease:easeOut}); }

  runSteps(steps,0,finish);
}

function showWin(name){
  // win effects: sound + shake + pulse, then reveal modal
  winSound();
  var stage=document.querySelector('.wheel-stage'), cv=document.getElementById('wheel');
  if(stage){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');}
  if(cv){cv.classList.remove('win-pulse');void cv.offsetWidth;cv.classList.add('win-pulse');}
  document.getElementById('win-name').textContent=name;
  document.getElementById('win-modal').classList.add('show');
  if(window.TRRfx){TRRfx.haptic([30,50,30,50,60]);TRRfx.confetti({count:130});}
  if(window.TRRAudit)TRRAudit.log('spinwheel','spin','สุ่มได้: '+name);
  // auto-remove from wheel if "no repeat" is on (name stays shown in modal)
  var rmBtn=document.getElementById('win-remove');
  if(document.getElementById('opt-remove').checked){ doRemoveWinner(); rmBtn.style.display='none'; }
  else rmBtn.style.display='';
}
function closeWin(){document.getElementById('win-modal').classList.remove('show');if(!spinning){weights=baseW();draw();}}
// Rebuild textarea text from names+baseWeights (keeps the "x3" suffix)
function linesText(){return names.map(function(nm,i){return baseWeights[i]>1?(nm+' x'+baseWeights[i]):nm;}).join('\n');}
function doRemoveWinner(){
  if(lastWinner>=0&&lastWinner<names.length){
    names.splice(lastWinner,1);baseWeights.splice(lastWinner,1);lastWinner=-1;
    document.getElementById('names').value=linesText();
    parseNames();
  }
}
function removeWinner(){ doRemoveWinner(); closeWin(); }

function loadDrivers(){
  if(!_db){if(window.TRRfx)TRRfx.toast('Firebase ไม่พร้อม',{type:'error'});return;}
  if(window.TRRfx)TRRfx.toast('กำลังโหลดชื่อคนขับ...');
  _db.collection('trr_config').doc('drivers').get().then(function(doc){
    if(!doc.exists){if(window.TRRfx)TRRfx.toast('ไม่พบข้อมูลคนขับ',{type:'warn'});return;}
    var d=doc.data(), out=[];
    ['6wheel','trailer'].forEach(function(k){(d[k]||[]).forEach(function(x){if(x&&x.name&&x.name.trim())out.push(x.name.trim());});});
    // dedupe
    var seen={},uniq=[];out.forEach(function(nm){if(!seen[nm]){seen[nm]=1;uniq.push(nm);}});
    if(!uniq.length){if(window.TRRfx)TRRfx.toast('ยังไม่มีชื่อคนขับ',{type:'warn'});return;}
    document.getElementById('names').value=uniq.join('\n');
    parseNames();
    if(window.TRRfx)TRRfx.toast('โหลด '+uniq.length+' ชื่อแล้ว',{type:'success'});
  }).catch(function(){if(window.TRRfx)TRRfx.toast('โหลดไม่สำเร็จ',{type:'error'});});
}

// ── Wire ──
document.getElementById('names').addEventListener('input',parseNames);
document.getElementById('spinBtn').addEventListener('click',spin);
document.getElementById('hub').addEventListener('click',spin);
document.getElementById('btn-clear').addEventListener('click',function(){document.getElementById('names').value='';parseNames();});
document.getElementById('btn-shuffle').addEventListener('click',function(){for(var i=names.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=names[i];names[i]=names[j];names[j]=t;var w=baseWeights[i];baseWeights[i]=baseWeights[j];baseWeights[j]=w;}document.getElementById('names').value=linesText();parseNames();});
document.getElementById('btn-drivers').addEventListener('click',loadDrivers);
document.getElementById('win-again').addEventListener('click',function(){closeWin();setTimeout(spin,250);});
document.getElementById('win-remove').addEventListener('click',removeWinner);
window.addEventListener('resize',sizeCanvas);
function setFull(on){document.body.classList.toggle('wheel-full',on);document.getElementById('btnExpand').textContent=on?'⤢ ย่อ':'⛶ เต็มจอ';setTimeout(sizeCanvas,60);}
document.getElementById('btnExpand').addEventListener('click',function(){setFull(!document.body.classList.contains('wheel-full'));});
document.getElementById('btnClose').addEventListener('click',function(){setFull(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('wheel-full'))setFull(false);});
window.addEventListener('message',function(e){if(e.data&&e.data.type==='trr_accent')draw();if(e.data&&e.data.type==='trr_dark_mode')draw();});

// ── Persist settings ──
(function(){
  try{
    var sd=localStorage.getItem('spinwheel_sound'); if(sd!==null)document.getElementById('opt-sound').checked=(sd==='1');
    var md=localStorage.getItem('spinwheel_mode'); if(md)document.getElementById('opt-mode').value=md;
    var rm=localStorage.getItem('spinwheel_remove'); if(rm==='1')document.getElementById('opt-remove').checked=true;
  }catch(e){}
  document.getElementById('opt-sound').addEventListener('change',function(){try{localStorage.setItem('spinwheel_sound',this.checked?'1':'0');}catch(e){}});
  document.getElementById('opt-mode').addEventListener('change',function(){try{localStorage.setItem('spinwheel_mode',this.value);}catch(e){}});
  document.getElementById('opt-remove').addEventListener('change',function(){try{localStorage.setItem('spinwheel_remove',this.checked?'1':'0');}catch(e){}});
})();

loadNames();
setTimeout(sizeCanvas,60);
